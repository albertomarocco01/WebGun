# Configurazione squawk di Schema Forge.
#
# Il gate NON viene declassato: squawk resta bloccante. Un rosso che tutti
# imparano a ignorare non e' piu' un controllo. Qui si dichiara solo quali
# regole di default sono in conflitto con convenzioni SCRITTE della skill.
#
# Uso:  squawk -c <questo file> supabase/migrations/*.sql
# Il comando `forge` la copia nella radice del progetto generato, cosi' il gate
# e' riproducibile anche fuori dalla skill.

excluded_rules = [
  # prefer-robust-stmts — chiede `if not exists` su ogni `create`.
  # Una migrazione versionata e' immutabile e si applica UNA volta sola, su un
  # database pulito (references/migrazioni.md). `if not exists` non la rende
  # robusta: le fa saltare in silenzio un oggetto gia' esistente, cioe' maschera
  # una deriva fra ambienti che deve invece far fallire la migrazione.
  "prefer-robust-stmts",

  # require-concurrent-index-creation — vedi PG01 in `.sqlfluff`.
  # `create index concurrently` non puo' stare nella transazione con cui il CLI
  # Supabase applica una migrazione, e su una tabella appena creata non c'e'
  # traffico da non bloccare.
  "require-concurrent-index-creation",
]

# NON disattivata, e non va disattivata: `prefer-bigint-over-int` aveva ragione.
# `integer` in centesimi si ferma a 21.474.836,47 euro; e cambiare il tipo dopo
# e' proprio l'`alter column type` che references/migrazioni.md classifica come
# pericoloso (riscrittura completa della tabella sotto lock esclusivo).
# Il denaro sta in `bigint` di centesimi — references/modellazione.md.
